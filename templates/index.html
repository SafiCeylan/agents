        // SFX Engine using Web Audio API
        const SFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            },
            play(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                if (type === 'hover') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.1);
                } else if (type === 'click') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.1);
                } else if (type === 'message') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
                }
            }
        };

        function StardustUI() {
            const canvasRef = useRef(null);
            const [velocity, setVelocity] = useState(0.2);
            const [activeAgent, setActiveAgent] = useState(AGENTS[0]);
            const [focusAgentId, setFocusAgentId] = useState(null);
            const [radius, setRadius] = useState(250);
            const rotationRef = useRef(0);
            const particlesRef = useRef([]);
            const holoRef = useRef([]);

            const [chat, setChat] = useState(INIT_CHAT);
            const [input, setInput] = useState("");
            const [isProcessing, setIsProcessing] = useState(false);
            const chatRef = useRef(null);
            const nextId = useRef(10);
            
            const [cpu, setCpu] = useState(45);
            const [mem, setMem] = useState(60);
            const [net, setNet] = useState(110);
            const [tasks, setTasks] = useState(INIT_TASKS);
            const [tab, setTab] = useState("ACTIVE");
            const [alerts, setAlerts] = useState([ { id: 1, agentId: "ATLAS", msg: "API Limit Aşımı" } ]);
            const [positions, setPositions] = useState([ { id: "POS-01", agentId: "VEGA", symbol: "BTC/USDT", type: "LONG", entry: 64200, current: 64550, pnl: "+0.54%", pnlColor: "#34D399" } ]);
            
            const [isCinematic, setIsCinematic] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const recognition = useRef(null);

            useEffect(() => {
                // Initialize SpeechRecognition
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition.current = new SpeechRecognition();
                    recognition.current.lang = 'tr-TR';
                    recognition.current.interimResults = false;
                    recognition.current.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setInput(transcript);
                        setIsRecording(false);
                        SFX.play('click');
                    };
                    recognition.current.onerror = () => setIsRecording(false);
                    recognition.current.onend = () => setIsRecording(false);
                }
            }, []);

            const toggleMic = () => {
                SFX.init(); SFX.play('click');
                if (isRecording) { recognition.current?.stop(); setIsRecording(false); }
                else { recognition.current?.start(); setIsRecording(true); }
            };

            useEffect(() => {
                const iv = setInterval(() => {
                    setCpu(c => Math.max(10, Math.min(95, c + (Math.random() - 0.5) * 15)));
                    setMem(m => Math.max(20, Math.min(90, m + (Math.random() - 0.5) * 5)));
                    setNet(n => Math.max(50, Math.min(300, n + (Math.random() - 0.5) * 30)));
                    
                    setTasks(prev => prev.map(t => {
                        if (t.progress < 100) return { ...t, progress: Math.min(100, t.progress + Math.floor(Math.random() * 5)) };
                        return t;
                    }));
                }, 1500);
                return () => clearInterval(iv);
            }, []);

            useEffect(() => {
                const handleResize = () => { const h = window.innerHeight; setRadius(Math.min(300, h * 0.28)); };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Master Animation Loop (Particles + Laser Graph + Audio Visualizer)
            useEffect(() => {
                const cvs = canvasRef.current;
                const ctx = cvs.getContext('2d');
                const size = radius * 2 + 200;
                cvs.width = size; cvs.height = size;

                if (particlesRef.current.length === 0) {
                    const pts = [];
                    for(let i=0; i<1500; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const u = 1 - Math.random(); const v = Math.random();
                        const z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                        pts.push({ angle: a, radius: radius + z * 30, size: Math.random() * 1.5 + 0.5, speedMulti: Math.random() * 0.3 + 0.85, color: Math.random() > 0.7 ? '#FFF' : (Math.random() > 0.3 ? '#00D4FF' : '#38BDF8'), alpha: Math.random() * 0.7 + 0.3 });
                    }
                    particlesRef.current = pts;
                }
                
                if (holoRef.current.length === 0) {
                    const hPts = [];
                    const numPoints = 250;
                    const phi = Math.PI * (3 - Math.sqrt(5)); // golden angle
                    for(let i=0; i<numPoints; i++) {
                        const y = 1 - (i / (numPoints - 1)) * 2; 
                        const radiusAtY = Math.sqrt(1 - y * y);
                        const theta = phi * i;
                        const x = Math.cos(theta) * radiusAtY;
                        const z = Math.sin(theta) * radiusAtY;
                        hPts.push({x, y, z, layer: 1}); // Outer shell
                        if (i % 2 === 0) {
                            hPts.push({x: x*0.5, y: y*0.5, z: z*0.5, layer: 2}); // Inner core
                        }
                    }
                    holoRef.current = hPts;
                }

                let animId;
                let lastTime = performance.now();
                let visualizerTime = 0;

                const loop = (time) => {
                    const dt = (time - lastTime) / 1000;
                    lastTime = time;
                    rotationRef.current += velocity * dt;
                    visualizerTime += dt;

                    ctx.clearRect(0, 0, size, size);
                    const cx = size / 2; const cy = size / 2;

                    // 1. Draw 3D Holographic Sphere
                    ctx.save();
                    const globeRadius = 50 + (isProcessing ? Math.sin(visualizerTime*15)*2 : 0);
                    const focalLength = 250;
                    const theta = visualizerTime * (isProcessing ? 2.5 : 0.6);
                    const colorHue = isProcessing ? "251, 191, 36" : "0, 212, 255";
                    
                    // Optional center glow
                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, globeRadius * 1.5);
                    grad.addColorStop(0, `rgba(${colorHue}, 0.15)`);
                    grad.addColorStop(1, "transparent");
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(cx, cy, globeRadius * 1.5, 0, Math.PI*2); ctx.fill();

                    for (let i = 0; i < holoRef.current.length; i++) {
                        const p = holoRef.current[i];
                        // Layer 1 rotates normal, Layer 2 rotates backwards faster
                        const layerTheta = p.layer === 1 ? theta : -theta * 1.5;
                        
                        const rx = p.x * Math.cos(layerTheta) - p.z * Math.sin(layerTheta);
                        const rz = p.x * Math.sin(layerTheta) + p.z * Math.cos(layerTheta);
                        const ry = p.y;
                        
                        // Tilt the globe slightly forwards
                        const tilt = 0.3;
                        const fx = rx;
                        const fy = ry * Math.cos(tilt) - rz * Math.sin(tilt);
                        const fz = ry * Math.sin(tilt) + rz * Math.cos(tilt);

                        const z3d = fz * globeRadius;
                        const scale = focalLength / (focalLength + z3d);
                        const px = cx + fx * globeRadius * scale;
                        const py = cy + fy * globeRadius * scale;
                        
                        // Depth fading (Z sorting trick with opacity)
                        const normalizedZ = (z3d + globeRadius) / (2 * globeRadius); // 0 to 1
                        const alpha = 0.1 + (1 - normalizedZ) * 0.9;
                        const size = (p.layer === 1 ? 1.5 : 1) * scale;
                        
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI*2);
                        ctx.fillStyle = `rgba(${colorHue}, ${alpha})`;
                        ctx.fill();
                    }
                    ctx.restore();

                    // 2. Draw Stardust Particles
                    for(let i=0; i<particlesRef.current.length; i++) {
                        const p = particlesRef.current[i];
                        const currentAngle = p.angle + rotationRef.current * p.speedMulti;
                        ctx.beginPath();
                        ctx.arc(cx + p.radius * Math.cos(currentAngle), cy + p.radius * Math.sin(currentAngle), p.size, 0, Math.PI*2);
                        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fill();
                    }
                    ctx.globalAlpha = 1.0;

                    // 3. Draw Laser Connections (Node Graph)
                    // Retrieve actual positions of agents using agentsData state trick
                    // To do this cleanly in canvas without React state delays, we calculate their pos here too
                    const rot = rotationRef.current;
                    const agentCoords = {};
                    
                    // TAU is always at the center
                    agentCoords["TAU"] = { x: cx, y: cy, color: "#7C6FE0" };

                    const WORKER_AGENTS = AGENTS.filter(a => a.id !== "TAU");
                    WORKER_AGENTS.forEach((ag, i) => {
                        const baseAngle = (i / WORKER_AGENTS.length) * Math.PI * 2;
                        const currentAngle = baseAngle + rot - Math.PI/2;
                        agentCoords[ag.id] = {
                            x: cx + radius * Math.cos(currentAngle),
                            y: cy + radius * Math.sin(currentAngle),
                            color: ag.color
                        };
                    });

                    // Draw lines from TAU (Supervisor) or Focus to others with tasks
                    // The 12 o'clock active agent no longer shoots lasers to other agents
                    const centerAgent = focusAgentId || "TAU";
                    if (agentCoords[centerAgent]) {
                        tasks.forEach(t => {
                            if (t.progress < 100 && t.agentId !== centerAgent && agentCoords[t.agentId]) {
                                ctx.beginPath();
                                ctx.moveTo(agentCoords[centerAgent].x, agentCoords[centerAgent].y);
                                ctx.lineTo(agentCoords[t.agentId].x, agentCoords[t.agentId].y);
                                const grad = ctx.createLinearGradient(agentCoords[centerAgent].x, agentCoords[centerAgent].y, agentCoords[t.agentId].x, agentCoords[t.agentId].y);
                                grad.addColorStop(0, agentCoords[centerAgent].color);
                                grad.addColorStop(1, agentCoords[t.agentId].color);
                                ctx.strokeStyle = grad;
                                ctx.lineWidth = 1.5;
                                ctx.globalAlpha = 0.6 + Math.sin(visualizerTime * 5) * 0.3; // pulsating laser
                                ctx.stroke();
                            }
                        });
                    }
                    ctx.globalAlpha = 1.0;

                    animId = requestAnimationFrame(loop);
                };
                animId = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(animId);
            }, [radius, velocity, isProcessing, activeAgent, focusAgentId, tasks]);

            const [agentsData, setAgentsData] = useState([]);
            useEffect(() => {
                let animId;
                const updateAgents = () => {
                    const rot = rotationRef.current;
                    const WORKER_AGENTS = AGENTS.filter(a => a.id !== "TAU");
                    const data = WORKER_AGENTS.map((ag, i) => {
                        const baseAngle = (i / WORKER_AGENTS.length) * Math.PI * 2;
                        const currentAngle = baseAngle + rot - Math.PI/2;
                        let distFromTop = (baseAngle + rot) % (Math.PI * 2);
                        if (distFromTop < 0) distFromTop += Math.PI * 2;
                        if (distFromTop > Math.PI) distFromTop = Math.PI * 2 - distFromTop;
                        return { ...ag, angle: currentAngle, dist: distFromTop };
                    });
                    
                    // Add TAU back with fixed properties so it's handled in the UI mapping
                    data.push({ ...AGENTS.find(a => a.id === "TAU"), isCenter: true });
                    
                    setAgentsData(data);
                    
                    let closest = data[0];
                    for(let i=1; i<data.length; i++) if (data[i].dist < closest.dist) closest = data[i];
                    setActiveAgent(prev => prev.id !== closest.id ? closest : prev);
                    
                    animId = requestAnimationFrame(updateAgents);
                };
                animId = requestAnimationFrame(updateAgents);
                return () => cancelAnimationFrame(animId);
            }, []);

            useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [chat]);

            const agentMap = { "Supervisor": "TAU", "Kishi": "KISHI", "Ghost": "GHOST", "Atlas": "ATLAS", "Nexus": "NEXUS", "Vega": "VEGA", "Cypher": "CYPHER" };

            const sendChat = async () => {
                if (!input.trim() || isProcessing) return;
                SFX.init(); SFX.play('click');
                const msg = input.trim(); 
                setInput(""); setIsProcessing(true);
                const ts = new Date().toLocaleTimeString("tr-TR",{hour12:false,hour:"2-digit",minute:"2-digit"});
                setChat(c => [...c, { id:nextId.current++, from:"user", text:msg, ts }]);

                try {
                    const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) });
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        for (const res of data.responses) {
                            const uiAgentId = agentMap[res.agent] || "TAU";
                            setChat(c => {
                                SFX.play('message');
                                return [...c, { id: nextId.current++, from: uiAgentId, text: res.content, ts: new Date().toLocaleTimeString("tr-TR",{hour12:false,hour:"2-digit",minute:"2-digit"}) }];
                            });
                            await new Promise(r => setTimeout(r, 600));
                        }
                    } else { setChat(c => { SFX.play('message'); return [...c, { id:nextId.current++, from:"TAU", text: "Hata: " + data.message, ts }]; }); }
                } catch (err) { setChat(c => { SFX.play('message'); return [...c, { id:nextId.current++, from:"TAU", text: "Bağlantı hatası.", ts }]; }); } 
                finally { setIsProcessing(false); }
            };

            const approveCommand = async (cmd) => {
                SFX.play('click');
                const ts = new Date().toLocaleTimeString("tr-TR",{hour12:false,hour:"2-digit",minute:"2-digit"});
                setChat(c => [...c, { id: nextId.current++, from: "user", text: `> SİSTEM YÖNETİCİSİ ONAYI: \`${cmd}\` komutu onaylandı.`, ts }]);
                setIsProcessing(true);
                try {
                    const response = await fetch('/api/execute_approved', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: cmd })
                    });
                    const data = await response.json();
                    if (data.status === 'success') {
                        setChat(c => [...c, { id: nextId.current++, from: "CYPHER", text: "Komut sandbox ortamında başarıyla yürütüldü. Sonuç sisteme iletildi.", ts }]);
                    } else {
                        setChat(c => [...c, { id: nextId.current++, from: "CYPHER", text: "Komut hatası: " + data.message, ts }]);
                    }
                } catch(err) {
                    setChat(c => [...c, { id: nextId.current++, from: "TAU", text: "Onay API bağlantı hatası.", ts }]);
                } finally {
                    setIsProcessing(false);
                }
            };

            const rejectCommand = (cmd) => {
                SFX.play('click');
                const ts = new Date().toLocaleTimeString("tr-TR",{hour12:false,hour:"2-digit",minute:"2-digit"});
                setChat(c => [...c, { id: nextId.current++, from: "user", text: `> SİSTEM YÖNETİCİSİ REDDİ: \`${cmd}\` komutu iptal edildi.`, ts }]);
            };

            const getActiveTask = (agentId) => tasks.find(t => t.agentId === agentId && t.progress < 100);
            
            const filteredTasks = tasks.filter(t => {
                if (focusAgentId && t.agentId !== focusAgentId) return false;
                if (tab === "ACTIVE") return t.progress < 100;
                return t.progress >= 100;
            });
            const filteredChat = chat.filter(m => {
                if (!focusAgentId) return true;
                return m.from === "user" || m.from === "TAU" || m.from === focusAgentId;
            });
            const filteredPositions = positions.filter(p => !focusAgentId || p.agentId === focusAgentId);

            return (
                <React.Fragment>
                    <style dangerouslySetInnerHTML={{__html: CSS}} />
                    <div className={"app-container " + (isCinematic ? "cinematic" : "")} onClick={() => SFX.init()}>
                        <div className="header">
                            <div className="logo-area"><div className="logo-icon"></div>SYNTHIC AI</div>
                            <div style={{display:'flex', gap: 15, alignItems: 'center'}}>
                                <button className="cine-toggle" onClick={() => { SFX.play('click'); setIsCinematic(!isCinematic); }}>
                                    {isCinematic ? "PANELİ AÇ" : "SİNEMATİK MOD"}
                                </button>
                                <div style={{color:"#8CA3B8", fontSize:12, fontFamily:"'Orbitron', sans-serif"}}>JARVIS CORE V2.2</div>
                            </div>
                        </div>

                        <div className="main-content">
                            <div className="stardust-layer">
                                <canvas ref={canvasRef}></canvas>
                                
                                <div className="center-info">
                                    <div className="status-text">SYSTEM OPTIMAL</div>
                                    <div className="status-sub">Stardust Interface Active</div>
                                    <div className="active-agent-desc" style={{borderColor: focusAgentId ? "#00D4FF" : activeAgent.color, color: focusAgentId ? "#FFF" : activeAgent.color}}>
                                        [{focusAgentId ? focusAgentId : activeAgent.name}] {focusAgentId ? "FOKUS MODU" : "Sistem Odaklandı"}
                                    </div>
                                    {focusAgentId && (
                                        <div><button className="focus-btn" onClick={() => { SFX.play('click'); setFocusAgentId(null); }}>Odaklamayı Temizle</button></div>
                                    )}
                                </div>

                                {agentsData.map(ag => {
                                    const isCenter = ag.isCenter;
                                    const x = isCenter ? "50%" : "calc(50% + " + (radius * Math.cos(ag.angle)) + "px)";
                                    const y = isCenter ? "50%" : "calc(50% + " + (radius * Math.sin(ag.angle)) + "px)";
                                    
                                    const isActive = activeAgent.id === ag.id && !isCenter;
                                    const agentTask = getActiveTask(ag.id);
                                    const isFocused = focusAgentId === ag.id;
                                    const isDimmed = focusAgentId && !isFocused && !isCenter;
                                    const hasAlert = alerts.some(a => a.agentId === ag.id);
                                    
                                    let orbClass = "agent-orb ";
                                    if (isCenter) orbClass += "tau-center ";
                                    if (isActive || isFocused) orbClass += "active ";
                                    if (agentTask) orbClass += "has-task ";
                                    if (isDimmed) orbClass += "dimmed ";
                                    
                                    return (
                                        <div key={ag.id} className="orb-wrapper" style={{left: x, top: y, "--ac": ag.color}} onMouseEnter={() => SFX.play('hover')} onClick={() => { SFX.play('click'); setFocusAgentId(prev => prev === ag.id ? null : ag.id); }}>
                                            <div 
                                                className={orbClass}
                                                style={{ borderColor: ag.color, color: isActive || isFocused ? "#FFF" : ag.color, boxShadow: isActive || isFocused ? "0 0 25px " + ag.color + ", inset 0 0 15px " + ag.color : "" }}
                                            >
                                                {ag.name.substring(0, 3)}
                                            </div>
                                            {hasAlert && <div className="agent-badge">!</div>}
                                            <div className="agent-tooltip" style={{borderColor: ag.color}}>
                                                <div style={{color: ag.color, fontWeight: 700, fontSize: 12}}>{ag.name}</div>
                                                <div style={{color: "#8CA3B8", marginBottom: 4}}>{ag.role}</div>
                                                {agentTask ? <div>"{agentTask.title}" ({agentTask.progress}%)</div> : <div style={{color: "#34D399"}}>Standby</div>}
                                            </div>
                                        </div>
                                    );
                                })}

                                <div className="velocity-panel">
                                    <div className="vp-header"><div className="vp-dot"></div>ORBITAL VELOCITY</div>
                                    <input type="range" className="vp-slider" min="-2.0" max="2.0" step="0.05" value={velocity} onChange={(e) => setVelocity(parseFloat(e.target.value))} />
                                    <div className="vp-value"><span>{velocity.toFixed(2)} rad/s</span></div>
                                </div>
                            </div>

                            <div className="panels-layer">
                                <div className="left-panel">
                                    <div>
                                        <div className="panel-title">// SİSTEM METRİKLERİ</div>
                                        <div className="metric-block">
                                            <div className="metric-row"><span>CPU YÜKÜ</span><span className="metric-val" style={{color: cpu > 80 ? "#F87171" : "#FFF"}}>{Math.round(cpu)}%</span></div>
                                            <div className="metric-bar-bg"><div className="metric-bar-fill" style={{width: cpu + "%", background: cpu > 80 ? "#F87171" : "#00D4FF"}}></div></div>
                                        </div>
                                        <div className="metric-block">
                                            <div className="metric-row"><span>BELLEK (MEM)</span><span className="metric-val">{Math.round(mem)}%</span></div>
                                            <div className="metric-bar-bg"><div className="metric-bar-fill" style={{width: mem + "%", background: "#7C6FE0"}}></div></div>
                                        </div>
                                    </div>
                                    
                                    <div style={{marginTop: 10, flex: 1, display: "flex", flexDirection: "column", overflow: "hidden"}}>
                                        <div className="tabs">
                                            <div className={"tab " + (tab === "ACTIVE" ? "active" : "")} onClick={() => { SFX.play('click'); setTab("ACTIVE"); }}>AKTİF GÖREVLER</div>
                                            <div className={"tab " + (tab === "HISTORY" ? "active" : "")} onClick={() => { SFX.play('click'); setTab("HISTORY"); }}>GEÇMİŞ</div>
                                        </div>
                                        <div style={{flex: 1, overflowY:"auto"}}>
                                            {filteredTasks.length === 0 && <div style={{color:"#64748B", fontSize:11, textAlign:"center", marginTop:20}}>Kayıt bulunamadı.</div>}
                                            {filteredTasks.map(t => (
                                                <div key={t.id} className="task-item">
                                                    <div className="task-header">
                                                        <span>{t.id}</span>
                                                        <span style={{color: t.color, fontWeight:700}}>{t.agentId}</span>
                                                    </div>
                                                    <div className="task-title">{t.title}</div>
                                                    <div className="task-bar-bg">
                                                        <div className="task-bar-fill" style={{width: t.progress + "%", background: t.color}}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {alerts.length > 0 && (
                                        <div style={{marginTop: "auto", borderTop: "1px solid rgba(239, 68, 68, 0.3)", paddingTop: 10}}>
                                            <div className="panel-title" style={{color: "#EF4444", borderColor: "rgba(239, 68, 68, 0.3)"}}>// SİSTEM UYARILARI</div>
                                            {alerts.map(a => (
                                                <div key={a.id} style={{color: "#EF4444", fontSize: 11, background: "rgba(239, 68, 68, 0.1)", padding: "6px 10px", borderRadius: 4, marginBottom: 5}}>
                                                    [{a.agentId}] {a.msg}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="right-panel">
                                    <div className="panel-title">
                                        <span>// TACTICAL COMMAND CONSOLE</span>
                                        <span style={{color: isProcessing ? "#FBBF24" : "#34D399"}}>{isProcessing ? "PROCESSING..." : "READY"}</span>
                                    </div>
                                    
                                    <div className="chat-messages" ref={chatRef}>
                                        {filteredChat.length === 0 && <div style={{color:"#64748B", fontSize:11, textAlign:"center", marginTop:20}}>Bu ajana ait log bulunamadı.</div>}
                                        {filteredChat.map(m => {
                                            const isUser = m.from === "user";
                                            const ag = AGENTS.find(a => a.id === m.from);
                                            const color = ag ? ag.color : "#00D4FF";
                                            
                                            let textContent = m.text || "";
                                            let commandRequest = null;
                                            const reqMatch = textContent.match(/\[COMMAND_REQUEST:\s*(.*?)\]/);
                                            if (reqMatch) {
                                                commandRequest = reqMatch[1];
                                                textContent = textContent.replace(reqMatch[0], "");
                                            }
                                            const htmlContent = marked.parse(textContent);

                                            return (
                                                <div key={m.id} className={"chat-msg " + (isUser ? "msg-user" : "msg-agent")} style={!isUser ? {borderColor: color, color: "#E0F2FE"} : {}}>
                                                    {!isUser && (
                                                        <div className="msg-header" style={{color: color}}><span style={{width:8, height:8, borderRadius:"50%", background: color, boxShadow: "0 0 5px " + color}}></span>{ag ? ag.name + " — " + ag.role : m.from}</div>
                                                    )}
                                                    {textContent.trim() && <div className="msg-content" dangerouslySetInnerHTML={{ __html: htmlContent }}></div>}
                                                    
                                                    {commandRequest && (
                                                        <div style={{marginTop: 10, background: "rgba(249, 115, 22, 0.15)", border: "1px solid #F97316", padding: 10, borderRadius: 6}}>
                                                            <div style={{color: "#F97316", fontSize: 11, fontWeight: 700, marginBottom: 5}}>⚠️ TERMİNAL İZİN İSTEĞİ (SANDBOX)</div>
                                                            <div style={{fontFamily: "monospace", color: "#FFF", marginBottom: 10, fontSize: 12}}>{commandRequest}</div>
                                                            <div style={{display: "flex", gap: 10}}>
                                                                <button className="btn-action" style={{borderColor: "#34D399", color: "#34D399", padding: "4px 10px", flex: 1}} 
                                                                        onClick={() => approveCommand(commandRequest)}>ONAYLA</button>
                                                                <button className="btn-action" style={{borderColor: "#EF4444", color: "#EF4444", padding: "4px 10px", flex: 1}} 
                                                                        onClick={() => rejectCommand(commandRequest)}>REDDET</button>
                                                            </div>
                                                        </div>
                                                    )}
                                                    
                                                    <div className="msg-ts">{m.ts}</div>
                                                </div>
                                            );
                                        })}
                                        {isProcessing && (
                                            <div className="chat-msg msg-agent" style={{opacity: 0.6, borderColor: "#00D4FF"}}><div className="msg-header" style={{color: "#00D4FF"}}>SYSTEM</div>Ajanlar analiz ediyor...</div>
                                        )}
                                    </div>

                                    {filteredPositions.length > 0 && (
                                        <div style={{marginTop: 10, borderTop: "1px solid rgba(0,212,255,0.1)", paddingTop: 10}}>
                                            <div className="panel-title" style={{fontSize: 10, marginBottom: 5}}>// AÇIK POZİSYONLAR</div>
                                            {filteredPositions.map(p => (
                                                <div key={p.id} className="pos-card">
                                                    <div className="pos-header"><span>{p.symbol} <span style={{color: "#34D399", fontSize:9, border:"1px solid", padding:"1px 4px", borderRadius:2}}>{p.type}</span></span><span style={{color: p.pnlColor, fontWeight: 700}}>{p.pnl}</span></div>
                                                    <div className="pos-body"><span>Giriş: {p.entry}</span><span>Anlık: {p.current}</span></div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="chat-input-area">
                                        <input type="text" className="chat-input" placeholder={focusAgentId ? `@${focusAgentId} için direkt komut...` : "Mesajınızı veya komutunuzu girin..."} value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && sendChat()} />
                                        <button className={"btn-action btn-mic " + (isRecording ? "recording" : "")} onClick={toggleMic} title="Sesli Komut">🎙️</button>
                                        <button className="btn-action" onClick={sendChat} disabled={isProcessing}>GÖNDER</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<StardustUI />);
        /* {% endraw %} */
    </script>
</body>
</html>
